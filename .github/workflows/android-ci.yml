name: EPIC07 Android CI

on:
  push:
    branches: [ main, 'agent/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Core unit tests
        run: gradle --no-daemon :core:test --stacktrace
      - name: Android JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle --no-daemon :app:lintDebug --stacktrace
      - name: Debug build
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Release R8 build
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Upload verification reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifetrace-finance-verification-reports
          path: |
            core/build/reports/tests/**
            core/build/test-results/**
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/lint-results-*
            app/schemas/**
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifetrace-finance-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Connected Compose and quick-entry tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace
      - name: Upload instrumentation reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifetrace-finance-instrumentation-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore

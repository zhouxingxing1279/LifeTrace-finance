name: BeeCount Flutter Android CI

on:
  push:
    branches: [main, 'agent/**']
    paths:
      - 'android/**'
      - 'assets/**'
      - 'lib/**'
      - 'packages/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/beecount-client-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'assets/**'
      - 'lib/**'
      - 'packages/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/beecount-client-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit and widget tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug --flavor dev
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beecount-client-debug-apk
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          if-no-files-found: ignore
